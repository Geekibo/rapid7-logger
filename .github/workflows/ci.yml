name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so the required status check is the single stable context "ci".
  # It is bootstrap-tolerant: until the toolchain lands (phase 1) there is nothing
  # to run, and this must not block doc-only pull requests.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect toolchain
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — the toolchain lands in phase 1. Nothing to check."
          fi

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.toolchain == 'true'
        with:
          node-version: 22
          cache: npm

      # npm ci, never npm install: a pull request must not be able to float a dependency.
      - name: Install
        if: steps.detect.outputs.toolchain == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.detect.outputs.toolchain == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.detect.outputs.toolchain == 'true'
        run: npm run lint

      - name: Build
        if: steps.detect.outputs.toolchain == 'true'
        run: npm run build

      # After Build: test/node/ spawns node against dist/ (DESIGN §8.3). Live tests skip
      # themselves without RAPID7_LIVE_TOKEN, which is never available to a pull request from a
      # fork. They must skip, never fail.
      - name: Test
        if: steps.detect.outputs.toolchain == 'true'
        run: npm test

      # Invariant 8 (CLAUDE.md): the edge bundle must run where node builtins do not exist, and
      # the Next entry runs on the Edge runtime too, so its bundles get the same check. A
      # regression here breaks consumers at deploy time, not build time.
      - name: Edge bundle must not import node builtins
        if: steps.detect.outputs.toolchain == 'true'
        run: |
          status=0
          for bundle in dist/edge.js dist/next.js dist/next.cjs; do
            if [ ! -f "$bundle" ]; then
              echo "::error::$bundle missing — the build should have produced it"
              status=1
              continue
            fi
            if grep -nE "(require\(|from[[:space:]]*)['\"]node:" "$bundle"; then
              echo "::error::$bundle imports a node: builtin — see CLAUDE.md invariant 8"
              status=1
            else
              echo "$bundle clean"
            fi
          done
          # Invariant 7 (DESIGN §6.5): the token is handed in by the app and must never come
          # from a NEXT_PUBLIC_ variable, and nothing shipped may touch a browser global.
          if grep -rn "NEXT_PUBLIC_" dist/; then
            echo "::error::dist/ references NEXT_PUBLIC_ — see CLAUDE.md invariant 7"
            status=1
          fi
          if grep -nwE "window|navigator|document" dist/*.js dist/*.cjs; then
            echo "::error::dist/ touches a browser global — see CLAUDE.md invariant 7"
            status=1
          fi
          exit $status

  # Invariant 7's done-when (#20): a Client Component importing the Next entry must fail
  # `next build`, and the same app without the misuse must build. Kept out of the required `ci`
  # context: it installs Next, React and a SWC binary into a fixture, which is slower and more
  # supply-chain surface than the unit suite. Never skips silently (REQUIRE_NEXT_BUILD_GUARD).
  next-client-import-guard:
    name: next-client-import-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect toolchain
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.toolchain == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/next-build/fixture/package-lock.json

      - name: Install and build the package
        if: steps.detect.outputs.toolchain == 'true'
        run: npm ci && npm run build

      - name: Install the fixture
        if: steps.detect.outputs.toolchain == 'true'
        run: npm ci --prefix test/next-build/fixture

      - name: Build the fixture with and without the misuse
        if: steps.detect.outputs.toolchain == 'true'
        env:
          REQUIRE_NEXT_BUILD_GUARD: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:next-build

  # The Next example (#21), built and started for real against a local log server: the
  # evidence that a render, a Route Handler and a Server Action each reach onRequestError and
  # that withLogging flushes after the response. Separate, parallel, not a required check.
  next-example:
    name: next-example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect toolchain
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "toolchain=true" >> "$GITHUB_OUTPUT"
          else
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.toolchain == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/nextjs-app/package-lock.json

      - name: Install and build the package
        if: steps.detect.outputs.toolchain == 'true'
        run: npm ci && npm run build

      - name: Install the example
        if: steps.detect.outputs.toolchain == 'true'
        run: npm ci --prefix examples/nextjs-app

      - name: Build, start and drive the example
        if: steps.detect.outputs.toolchain == 'true'
        env:
          REQUIRE_NEXT_EXAMPLE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run test:next-app
