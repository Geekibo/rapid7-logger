version: 2
updates:
  # The package ships zero runtime dependencies, so this is devDependencies and
  # the release toolchain — which is exactly the surface that can publish (§11.4).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Grouped into a single pull request, monthly. Security updates arrive
  # separately via Dependabot security updates and are not held to this schedule.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
