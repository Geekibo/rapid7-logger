version: 2
updates:
  # The package ships zero runtime dependencies, so this is devDependencies and
  # the release toolchain — which is exactly the surface that can publish (§11.4).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8 caps its peer range below 6.1; move with it, by hand.
      - dependency-name: typescript
        versions: [">=6.0.0"]
      # Kept at the lowest major the toolchain accepts (Vitest 5: ^22), so the types stay
      # as close to the engines floor (Node 20.9) as possible.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dev-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Grouped into a single pull request, monthly. Security updates arrive
  # separately via Dependabot security updates and are not held to this schedule.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
